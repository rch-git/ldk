# port forward. output shows 8080 because that is the container port. the container serving argocd serves on port 8080. the service maps 80 to 8080
sysuser@ubuntudev:~/git/ldk/k8s/31-argocd (master -> origin/master)$ kubectl --namespace argocd port-forward svc/argocd-server 7894:80

