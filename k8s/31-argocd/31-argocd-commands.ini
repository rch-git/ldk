# create argocd namespace
sysuser@ubuntudev:~/git/ldk/k8s/31-argocd (master -> origin/master)$ kubectl create namespace argocd

# output
namespace/argocd created

# it is not needed in this instance because the password is already added, but required when starting a new installation
# to generate the admin password. this should be included in /home/sysuser/git/ldk/k8s/31-argocd/argocd-install.yaml or any other argocd installation yaml
sysuser@ubuntudev:~/git/ldk/k8s/31-argocd (master -> origin/master)$ HASH=$(htpasswd -nbBC 10 admin 'password123' | cut -d: -f2) && echo $HASH

# output
$2y$10$ud.sQ0iLzBJUcM0/In/hDe9ssfgo5no./ONZdJ3GMWEJcHf5xVZrO

