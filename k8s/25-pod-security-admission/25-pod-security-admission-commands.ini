# feature to check pods before they are admitted. make sure they meet the security standards. 
# API request is set to admission control, and it can be rejected if they are not up to the standards. 
# they are built on pod security standards. privileged, baseline, restricted. 
# works at namespace level and admission controller enforces this rule. modes: enforce, warn, audit
# pod-security.kubernetes.io/enforce=[restricted,privileged,baseline]
# pod-security.kubernetes.io/enforce-version=latest

# create a namespace and show its labels
sysuser@ubuntuprod:~/git/ldk/k8s/25-pod-security-admission (master -> origin/master)$ kubectl create namespace psa-unrestricted && echo "---NS---" && kubectl get ns psa-unrestricted --show-labels

# output
namespace/psa-unrestricted created
---NS---
NAME               STATUS   AGE   LABELS
psa-unrestricted   Active   0s    kubernetes.io/metadata.name=psa-unrestricted

# set the current context to psa-unrestricted. switch it back once done with the tutorial. 
sysuser@ubuntuprod:~/git/ldk/k8s/25-pod-security-admission (master -> origin/master)$ kubectl config set-context --current --namespace=psa-unrestricted && kubectl get all

# output
Context "kind-klc" modified.
No resources found in psa-unrestricted namespace.

# create a pod in psa-unrestricted namespace
sysuser@ubuntuprod:~/git/ldk/k8s/25-pod-security-admission (master -> origin/master)$ kubectl -n psa-unrestricted run nginxpod-insecure --image=nginx --dry-run=client -o yaml | tee nginxpod-insecure.yaml

# output
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginxpod-insecure
  name: nginxpod-insecure
  namespace: psa-unrestricted
spec:
  containers:
  - image: nginx
    name: nginxpod-insecure
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}

# manually edit the pod spec to add things that are not desirable and apply the file
sysuser@ubuntuprod:~/git/ldk/k8s/25-pod-security-admission (master -> origin/master)$ kubectl apply -f nginxpod-insecure.yaml && sleep 2 && echo "---PODS---" && kubectl get pods -o wide --show-labels

