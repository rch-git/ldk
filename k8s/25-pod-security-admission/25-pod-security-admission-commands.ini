# create pod spec. this will be rejected because restricted standards would reject this. make changes to this and apply it
sysuser@ubuntuprod:~/git/ldk/k8s/25-pod-security-admission (master -> origin/master)$ kubectl run -n psa-restricted nginxpod-restricted --image=nginx --dry-run=client -o yaml | tee nginxpod-restricted.yaml
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginxpod-restricted
  name: nginxpod-restricted
  namespace: psa-restricted
spec:
  containers:
  - image: nginx
    name: nginxpod-restricted
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}


