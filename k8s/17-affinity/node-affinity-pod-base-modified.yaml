apiVersion: v1
kind: Pod
metadata:
  labels:
    run: node-affinity-pod
  name: node-affinity-pod
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: disktype
            operator: In
            values: 
            - ssd
  containers:
  - image: nginx
    name: node-affinity-pod
  dnsPolicy: ClusterFirst
  restartPolicy: Always
