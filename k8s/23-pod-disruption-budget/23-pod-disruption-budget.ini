# For voluntary disruptions. pdb != replicas

# create myns namespace and set that to the current context if not already. 
sysuser@ubuntuprod:~/git/ldk/k8s/23-pod-disruption-budget (master -> origin/master)$ kubectl create namespace myns && kubectl config set-context --current --namespace=myns && kubectl get all

# output
namespace/myns created
Context "kind-klc" modified.
No resources found in myns namespace.

# Create a deployment with 5 replicas and apply it. 
sysuser@ubuntuprod:~/git/ldk/k8s/23-pod-disruption-budget (master -> origin/master)$ kubectl create deployment nginxdep --image=nginx --replicas=5 --dry-run=client -o yaml | tee nginxdep-base.yaml && kubectl apply -f nginxdep-base.yaml && sleep 7 && echo "---PODS---" && kubectl get pods -o wide

# output
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginxdep
  name: nginxdep
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginxdep
  strategy: {}
  template:
    metadata:
      labels:
        app: nginxdep
    spec:
      containers:
      - image: nginx
        name: nginx
        resources: {}
status: {}
