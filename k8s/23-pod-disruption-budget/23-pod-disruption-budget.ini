# use pod disruption budget to set minimum available pods. use label app=nginxdep
sysuser@ubuntuprod:~/git/ldk/k8s/23-pod-disruption-budget (master -> origin/master)$ kubectl create pdb nginxpdb --selector=app=nginxdep --min-available=2 --dry-run=client -o yaml | tee nginxpdb-base.yaml

# output
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginxpdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nginxdep
status:
  currentHealthy: 0
  desiredHealthy: 0
  disruptionsAllowed: 0
  expectedPods: 0

