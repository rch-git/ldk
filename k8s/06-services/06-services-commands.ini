sysuser@ubuntuprod:~/git/ldk/k8s/06-services/nodeport (master -> origin/master)$ kubectl delete service/nginxdep --now

# now expose the deploymennt as a node port
sysuser@ubuntuprod:~/git/ldk/k8s/06-services/nodeport (master -> origin/master)$ kubectl expose deployment/nginxdep --type=NodePort --port 8080 --target-port 80 --dry-run=client -o yaml | tee nginxnp.yaml && kubectl apply -f nginxnp.yaml && kubectl get svc -o wide

