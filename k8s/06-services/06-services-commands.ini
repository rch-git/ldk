### CLUSTER IP ### 

# create the deployment and tee it to a file, and then change the container name
sysuser@ubuntuprod:~/git/ldk/k8s/06-services/clusterip (master -> origin/master)$ kubectl create deployment nginxdep --image=spurin/nginx-debug --port=80 --replicas=3 -o yaml --dry-run=client | tee nginxdep.yaml

# apply the deployment and expose it and tee it to a file
sysuser@ubuntuprod:~/git/ldk/k8s/06-services/clusterip (master -> origin/master)$ kubectl expose deployment/nginxdep --port 8080 --target-port 80 --dry-run=client -o yaml | tee nginxcip.yaml

# output
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginxdep
  name: nginxdep
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: nginxdep
status:
  loadBalancer: {}


# apply the file and get the services
sysuser@ubuntuprod:~/git/ldk/k8s/06-services/clusterip (master -> origin/master)$ kubectl apply -f nginxcip.yaml && kubectl get svc -o wide

# output
