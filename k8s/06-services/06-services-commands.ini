# traffic sent to 172.18.0.3:30476.
# kube-proxy on the control-plane node intercepts it.
# It chooses one of the three healthy pods (using its load-balancing algorithm — often random or round-robin).
# It rewrites the destination IP to the chosen pod's IP (10.244.1.61:80 in this case) and forwards the packet over the pod network (CNI).
# The pod responds. The reply is sent back through the reverse path (with SNAT so the client sees a clean connection).
# The nginx container in the pod prints

# we cannot do hit 8080 (service port) from outside the cluster because there is no external IP for the service. if this was a load balancer, than an external IP would be available

