### EXTERNAL NAME ###

# external name is a DNS Cname, which is an alias of another domain

# create a deployment nginxred
sysuser@ubuntuprod:~/git/ldk/k8s/06-services/externalname (master -> origin/master)$ kubectl create deployment nginxdepred --image=spurin/nginx-red --port 8080 --dry-run=client -o yaml | tee nginxdepred.yaml && kubectl apply -f nginxdepred.yaml

# output
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginxdepred
  name: nginxdepred
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginxdepred
  strategy: {}
  template:
    metadata:
      labels:
        app: nginxdepred
    spec:
      containers:
      - image: spurin/nginx-red
        name: nginx-red
        ports:
        - containerPort: 8080
        resources: {}
status: {}
deployment.apps/nginxdepred created

