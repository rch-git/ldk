### HEADLESS SERVICE ###

# headless service can act as a round robin. we are hitting the pods directly. therefore the service port is not accessible (8080). we have to use the application port (80), not to be confused with target port.
# create a deployment with 3 replicas serving on port 8080
sysuser@ubuntuprod:~/git/ldk/k8s/06-services/headless (master -> origin/master)$ kubectl create deployment nginxdep --image=spurin/nginx-debug --replicas=3 --port 8080 --dry-run=client -o yaml | tee nginxdep.yaml && kubectl apply -f nginxdep.yaml

# output
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginxdep
  name: nginxdep
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginxdep
  strategy: {}
  template:
    metadata:
      labels:
        app: nginxdep
    spec:
      containers:
      - image: spurin/nginx-debug
        name: nginx-debug
        ports:
        - containerPort: 8080
        resources: {}
status: {}
deployment.apps/nginxdep created

# expose this as a cluster ip and capture it as a yaml file
sysuser@ubuntuprod:~/git/ldk/k8s/06-services/headless (master -> origin/master)$ kubectl expose deployment/nginxdep --type=ClusterIP --port 8080 --target-port 80 --dry-run=client -o yaml | tee nginxdep-headless.yaml

# output
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginxdep
  name: nginxdep
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: nginxdep
  type: ClusterIP
status:
  loadBalancer: {}

# edit the yaml and set clusterIP to none. and then apply it. 
sysuser@ubuntuprod:~/git/ldk/k8s/06-services/headless (master -> origin/master)$ kubectl apply -f nginxdep-headless.yaml && kubectl get svc -o wide

