apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginxdepblue
  name: nginxdepblue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginxdepblue
  strategy: {}
  template:
    metadata:
      labels:
        app: nginxdepblue
    spec:
      containers:
      - image: spurin/nginx-blue
        name: nginx-blue
        ports:
        - containerPort: 8080
        resources: {}
status: {}
