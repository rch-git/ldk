# create directories
sysuser@ubuntudev:~/git/ldk/k8s/28-kustomize/kustomize-demo (master -> origin/master)$ mkdir -p overlays/dev overlays/prod

# copy template file into dev
sysuser@ubuntudev:~/git/ldk/k8s/28-kustomize/kustomize-demo (master -> origin/master)$ cp base/kustomization.yaml overlays/dev/

# make appropriate changes and run kustomize on the overlays/dev directory
sysuser@ubuntudev:~/git/ldk/k8s/28-kustomize/kustomize-demo (master -> origin/master)$ kubectl kustomize overlays/dev/ | tee overlays/dev/kustomize-output.yaml

# output
