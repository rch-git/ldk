# declarative management of kubernetes objects. it is a kubectl sub command
# kustomize never edits source yaml. 

## This is running in default namespace. switch context accordingly. ##

# create base directory
sysuser@ubuntudev:~/git/ldk/k8s/28-kustomize (master -> origin/master)$ mkdir -p kustomize-demo/base

# create a deployment
sysuser@ubuntudev:~/git/ldk/k8s/28-kustomize/kustomize-demo (master -> origin/master)$ kubectl create deployment 

# output
nginxwebdep --image=nginx --port=80 --dry-run=client -o yaml | tee base/nginxwebdep.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginxwebdep
  name: nginxwebdep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginxwebdep
  strategy: {}
  template:
    metadata:
      labels:
        app: nginxwebdep
    spec:
      containers:
      - image: nginx
        name: nginx
        ports:
        - containerPort: 80
        resources: {}
status: {}

# apply the deployment
sysuser@ubuntudev:~/git/ldk/k8s/28-kustomize/kustomize-demo (master -> origin/master)$ kubectl apply -f base/nginxwebdep.yaml 

# output
deployment.apps/nginxwebdep created

# create a service yaml
sysuser@ubuntudev:~/git/ldk/k8s/28-kustomize/kustomize-demo (master -> origin/master)$ kubectl expose deployment nginxwebdep -o yaml --dry-run=client | tee base/nginxwebsvc.yaml

# output
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginxwebdep
  name: nginxwebdep
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: nginxwebdep
status:

# delete the deployment at this point because we have the templates needed
sysuser@ubuntudev:~/git/ldk/k8s/28-kustomize/kustomize-demo (master -> origin/master)$ kubectl delete -f base/nginxwebdep.yaml 

# output
deployment.apps "nginxwebdep" deleted from default namespace

# create kustomization.yaml in the base directory and run kubectl kustomize
sysuser@ubuntudev:~/git/ldk/k8s/28-kustomize/kustomize-demo (master -> origin/master)$ kubectl kustomize base | tee base/kustomize-output.yaml

# output
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginxwebdep
  name: finance-nginxwebdep
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: nginxwebdep
status:
  loadBalancer: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginxwebdep
  name: finance-nginxwebdep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginxwebdep
  strategy: {}
  template:
    metadata:
      labels:
        app: nginxwebdep
    spec:
      containers:
      - image: nginx
        name: nginx
        ports:
        - containerPort: 80
        resources: {}
status: {}

# either use the file to apply or use kustomize to apply the yaml output
sysuser@ubuntudev:~/git/ldk/k8s/28-kustomize/kustomize-demo (master -> origin/master)$ kubectl apply -k base

# output
service/finance-nginxwebdep created
deployment.apps/finance-nginxwebdep created

