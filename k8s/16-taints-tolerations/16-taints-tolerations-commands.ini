test-taint-7cf87658d-6t2m4   0/1     Pending   0          0s    <none>   <none>   <none>           <none>

# add toleration and apply the file
sysuser@ubuntuprod:~/git/ldk/k8s/16-taints-tolerations (master -> origin/master)$ kubectl apply -f test-taint-toleration.yaml && sleep 2 && echo "---DEPLOYMENT---" && kubectl get deployment -o wide && echo "---PODS---" && kubectl get pods -o wide

