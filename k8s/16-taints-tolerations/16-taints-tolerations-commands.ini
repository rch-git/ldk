# taints are applied to nodes. pods that do not have matching tolerations are not accepted
# tolerations are applied to pods. this allows them to be scheduled on nodes with matching taints.

# control plane on kind cluster has a taint so no pods will be scheduled on this node.
sysuser@ubuntuprod:~/git/ldk/k8s/16-taints-tolerations (master -> origin/master)$ kubectl describe node/klc-control-plane > klc-control-plane.json && kubectl describe node/klc-control-plane | grep Taints

# output
Taints:             node-role.kubernetes.io/control-plane:NoSchedule

# remove the taint
sysuser@ubuntuprod:~/git/ldk/k8s/16-taints-tolerations (master -> origin/master)$ kubectl taint node klc-control-plane node-role.kubernetes.io/control-plane:NoSchedule-

# output
node/klc-control-plane untainted

# add taint back
sysuser@ubuntuprod:~/git/ldk/k8s/16-taints-tolerations (master -> origin/master)$ kubectl taint node klc-control-plane node-role.kubernetes.io/control-plane:NoSchedule

# output
node/klc-control-plane tainted

# create a taint
sysuser@ubuntuprod:~/git/ldk/k8s/16-taints-tolerations (master -> origin/master)$ kubectl taint node klc-worker custom-taint1:NoSchedule

# output
node/klc-worker tainted

# describe node
sysuser@ubuntuprod:~/git/ldk/k8s/16-taints-tolerations (master -> origin/master)$ kubectl describe node/klc-worker | grep Taints

# output
Taints:             custom-taint1:NoSchedule

# create deployment
sysuser@ubuntuprod:~/git/ldk/k8s/16-taints-tolerations (master -> origin/master)$ kubectl create deployment test-taint --image=nginx --dry-run=client -o yaml | tee test-taint-base.yaml && cp test-taint-base.yaml test-taint-modified.yaml

# output
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: test-taint
  name: test-taint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-taint
  strategy: {}
  template:
    metadata:
      labels:
        app: test-taint
    spec:
      containers:
      - image: nginx
        name: nginx
        resources: {}
status: {}

# apply the file and get the deployment and pods. it is pending because the node has a taint
sysuser@ubuntuprod:~/git/ldk/k8s/16-taints-tolerations (master -> origin/master)$ kubectl apply -f test-taint-modified.yaml && echo "---DEPLOYMENT---" && kubectl get deployment -o wide && echo "---PODS---" && kubectl get pods -o wide

# output
