# daemon sets do not have a spec in kubernetes. it is best to create a deployment and change it to a daemon set. 

# create a deployment to run a while loop in alpine linux
sysuser@ubuntuprod:~/git/ldk/k8s/04-daemonsets (master -> origin/master)$ kubectl create deployment loggerdep --image=alpine -n myns -o yaml --dry-run=client -- /bin/sh -c 'while true; do date +"%Y-%m-%d-%H:%M:%S - Hello from $NODE_NAME"; sleep 30; done' | tee loggerdep.yaml

# output
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: loggerdep
  name: loggerdep
  namespace: myns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loggerdep
  strategy: {}
  template:
    metadata:
      labels:
        app: loggerdep
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - while true; do date +"%Y-%m-%d-%H:%M:%S - Hello from $NODE_NAME"; sleep
          30; done
        image: alpine
        name: alpine
        resources: {}
status: {}

# apply the deployment
sysuser@ubuntuprod:~/git/ldk/k8s/04-daemonsets (master -> origin/master)$ kubectl apply -f loggerdep.yaml 

# output
deployment.apps/loggerdep created

# get the logs based on the label
sysuser@ubuntuprod:~/git/ldk/k8s/04-daemonsets (master -> origin/master)$ kubectl logs -l app=loggerdep

# output
# NODE_NAME doesnt exist yet, so its empty
2026-06-20-16:23:58 - Hello from 
2026-06-20-16:24:28 - Hello from

# get pod spec
sysuser@ubuntuprod:~/git/ldk/k8s/04-daemonsets (master -> origin/master)$ kubectl get pod/loggerdep-b65c4cb75-gjrjt -o yaml | tee loggerdep-b65c4cb75-gjrjt.yaml

# create a new deployment file, add the environment varialble and monitor the logs
sysuser@ubuntuprod:~/git/ldk/k8s/04-daemonsets (master -> origin/master)$ kubectl replace --force=true -f loggerdep-env.yaml && kubectl rollout status deployment/loggerdep && kubectl logs -l app=loggerdep

