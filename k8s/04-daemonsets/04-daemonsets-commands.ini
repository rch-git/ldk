# we will delete this deployment and convert it into a daemonset
sysuser@ubuntuprod:~/git/ldk/k8s/04-daemonsets (master -> origin/master)$ kubectl apply -f loggerds.yaml 

# output
daemonset.apps/loggerds created

# get daemonsets, pods and logs. pods are automatically created on all nodes where it can run. if it is not running on control plane, its because something is preventing it from running on it, like a taint
