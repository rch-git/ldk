# apply network policy
sysuser@ubuntuprod:~/git/ldk/k8s/20-networkpolicies (master -> origin/master)$ kubectl apply -f nginxnp-ingress-network-policy.yaml && echo "---NETWORK-POLICY---" && kubectl get networkpolicies -o wide

# output
networkpolicy.networking.k8s.io/nginxnp created
---NETWORK-POLICY---
NAME      POD-SELECTOR   AGE
nginxnp   run=nginxpod   0s


