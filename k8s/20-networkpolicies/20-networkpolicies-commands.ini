# pods can be classified as isolated
# limit access to other pods, ip blocks

# create an nginx pod and expose it as a cluster ip service
sysuser@ubuntuprod:~/git/ldk/k8s/20-networkpolicies (master -> origin/master)$ kubectl run nginxpod --image=nginx && kubectl expose pod/nginxpod --port=80 && echo "---SVC---" && kubectl get svc -o wide

# output
pod/nginxpod created
service/nginxpod exposed
---SVC---
NAME       TYPE        CLUSTER-IP     EXTERNAL-IP   PORT(S)   AGE   SELECTOR
nginxpod   ClusterIP   10.96.252.91   <none>        80/TCP    0s    run=nginxpod

# run curlpod
sysuser@ubuntuprod:~/git/ldk/k8s/20-networkpolicies (master -> origin/master)$ kubectl run curlpod -it --image=curlimages/curl --rm --restart=Never -- sh

# output
All commands and output from this session will be recorded in container logs, including credentials and sensitive information passed through the command prompt.
If you don't see a command prompt, try pressing enter.

# nslookup
~ $ nslookup 10.96.252.91
Server:		10.96.0.10
Address:	10.96.0.10:53

91.252.96.10.in-addr.arpa	name = nginxpod.myns.svc.cluster.local

~ $ 


