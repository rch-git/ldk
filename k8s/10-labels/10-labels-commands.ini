# ci/cd pipeline can use labels to idenfity applications and also for deployment. network policies can use label selectors for rules. 
# create an nginx pod and tee it to a file
sysuser@ubuntuprod:~/git/ldk/k8s/10-labels (master -> origin/master)$ kubectl run nginxpod --image=nginx --port=80 -o yaml --dry-run=client | tee nginxpod.yaml 

# output
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginxpod
  name: nginxpod
spec:
  containers:
  - image: nginx
    name: nginxpod
    ports:
    - containerPort: 80
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}

# apply the file
sysuser@ubuntuprod:~/git/ldk/k8s/10-labels (master -> origin/master)$ kubectl apply -f nginxpod.yaml 

# output
pod/nginxpod created

# expose as a ClusterIP
sysuser@ubuntuprod:~/git/ldk/k8s/10-labels (master -> origin/master)$ kubectl expose pod/nginxpod --type=ClusterIP --port 8080 --target-port 80 --dry-run=client -o yaml | tee nginxpodcip.yaml && kubectl apply -f nginxpodcip.yaml && kubectl get all -o wide

# output
apiVersion: v1
kind: Service
metadata:
  labels:
    run: nginxpod
  name: nginxpod
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    run: nginxpod
  type: ClusterIP
status:
  loadBalancer: {}
service/nginxpod created
