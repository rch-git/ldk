# create a yaml output of three ubuntu pods with a separator and tee it to a file
sysuser@ubuntuprod:~/git/ldk/k8s/10-labels (master -> origin/master)$ YAML=$(kubectl run ubuntupod --image=ubuntu --dry-run=client -o yaml --command sleep infinity) && echo -e "${YAML}\n---\n${YAML}\n---\n${YAML}" | tee colorpods.yaml

# output
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: ubuntupod
  name: ubuntupod
spec:
  containers:
  - command:
    - sleep
    - infinity
    image: ubuntu
    name: ubuntupod
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: ubuntupod
  name: ubuntupod
