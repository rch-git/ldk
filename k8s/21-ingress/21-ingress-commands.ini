# create minimal-ingress.yaml. copy this file, create myingress-app.yaml. make necessary changes to this file. 
sysuser@ubuntuprod:~/git/ldk/k8s/21-ingress (master -> origin/master)$ kubectl create ingress minimal-ingress --class=nginx-example --rule="/testpath*=test:80" -o yaml --dry-run=client | tee minimal-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minimal-ingress
spec:
  ingressClassName: nginx-example
  rules:
  - http:
      paths:
      - backend:
          service:
            name: test
            port:
              number: 80
        path: /testpath
        pathType: Prefix
status:
  loadBalancer: {}

