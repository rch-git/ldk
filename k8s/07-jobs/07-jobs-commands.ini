### CRON JOBS ###

# website for cron syntax - https://crontab.guru/
# create a cron job to calculate pi
sysuser@ubuntuprod:~/git/ldk/k8s/07-jobs/cronjobs (master -> origin/master)$ kubectl create cronjob calculatepi --image=perl:5.34.0 --schedule="* * * * *" --dry-run=client -o yaml -- "perl" "-Mbignum=bpi" "-wle" "print bpi(2000)" | tee calculatepicron.yaml && sleep 1 && kubectl apply -f calculatepicron.yaml  && kubectl get cronjob -o wide

# cronjob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: calculatepi
spec:
  jobTemplate:
    metadata:
      name: calculatepi
    spec:
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - perl
            - -Mbignum=bpi
            - -wle
            - print bpi(2000)
            image: perl:5.34.0
            name: calculatepi
            resources: {}
          restartPolicy: OnFailure
  schedule: '* * * * *'
status: {}
