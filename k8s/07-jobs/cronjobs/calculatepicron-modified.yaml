apiVersion: batch/v1
kind: CronJob
metadata:
  name: calculatepi
spec:
  jobTemplate:
    metadata:
      name: calculatepi
    spec:
      completions: 20
      parallelism: 5
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - perl
            - -Mbignum=bpi
            - -wle
            - print bpi(2000)
            image: perl:5.34.0
            name: calculatepi
            resources: {}
          restartPolicy: OnFailure
  schedule: '* * * * *'
status: {}
