apiVersion: batch/v1
kind: Job
metadata:
  name: calculatepi
spec:
  completions: 20 # create 20 pods in total
  parallelism: 5 # number of pods that can run in parallel
  template:
    metadata: {}
    spec:
      containers:
      - command:
        - perl
        - -Mbignum=bpi
        - -wle
        - print bpi(2000)
        image: perl:5.34.0
        name: calculatepi
        resources: {}
      restartPolicy: Never
status: {}
