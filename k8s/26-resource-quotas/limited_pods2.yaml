apiVersion: v1
kind: Pod
metadata:
  name: red
  namespace: limited
spec:
  containers:
  - name: red
    image: spurin/cpu-mem-simulator:latest
    args: ["-MiB", "64", "-milliseconds", "100"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
---
