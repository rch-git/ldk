apiVersion: v1
kind: Pod
metadata:
  labels:
    run: ubuntupod
  name: ubuntupod
spec:
  containers:
  - args:
    - /bin/sh
    - -c
    - for i in $(seq 0 1 1000000); do echo "$i"; sleep 0.1; done
    image: ubuntu
    name: ubuntupod
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
