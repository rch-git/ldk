apiVersion: v1
kind: Pod
metadata:
  labels:
    run: combined
  name: combined
spec:
  containers:
  - name: nginxpod
    image: nginx
    resources: {}
  - name: ubuntupod
    image: ubuntu
    args:
    - /bin/sh
    - -c
    - while true; do echo "$(date + '%T') - Hello from ubuntu"; sleep 5; if [ -f /tmp/crash ]; then exit 1; fi; done
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}